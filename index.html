<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Tense &amp; Verb Practice</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="settings-panel">
  <h2 id="panelTitle">Settings</h2>

  <button type="button" id="tutorialLink" class="tutorial-link">📘 Reference / রেফারেন্স</button>

  <div class="field">
    <label id="labelLanguage">Language</label>
    <select id="languageSelect">
      <option value="en">English</option>
      <option value="bn">বাংলা</option>
    </select>
  </div>

  <div class="mode-tabs" id="modeTabs">
    <button type="button" class="mode-tab" data-mode="vocab" id="modeVocabBtn">Vocabulary</button>
    <button type="button" class="mode-tab" data-mode="tense" id="modeTenseBtn">Tense Practice</button>
    <button type="button" class="mode-tab" data-mode="regularVerbs" id="modeRegularVerbsBtn">Regular Verbs</button>
    <button type="button" class="mode-tab" data-mode="pos" id="modePosBtn">Parts of Speech</button>
    <button type="button" class="mode-tab" data-mode="synonyms" id="modeSynonymsBtn">Synonyms & Antonyms</button>
    <button type="button" class="mode-tab" data-mode="sentence" id="modeSentenceBtn">Sentence Structure</button>
    <button type="button" class="mode-tab" data-mode="quiz" id="modeQuizBtn">Quiz</button>
  </div>

  <!-- Tense mode controls -->
  <div id="tenseControls">
    <div class="field">
      <label id="labelChapter">Chapter</label>
      <select id="chapterSelect"></select>
    </div>

    <div class="field">
      <label id="labelVerb">Verb</label>
      <select id="verbSelect"></select>
    </div>
  </div>

  <!-- Regular Verbs mode controls -->
  <div id="regularVerbsControls" hidden>
    <div class="field">
      <label id="labelRegularVerbsCount">Number of verbs</label>
      <input type="number" id="regularVerbsCountInput" min="1" max="89" value="20">
    </div>
  </div>

  <!-- Vocabulary mode controls -->
  <div id="vocabControls" hidden>
    <div class="field">
      <label id="labelTopic">Topic</label>
      <select id="topicSelect"></select>
    </div>

    <div class="field">
      <label id="labelPronoun">Pronoun</label>
      <select id="pronounSelect"></select>
    </div>
    <div class="field">
      <label id="labelVocabCount">Number of words</label>
      <input type="number" id="vocabCountInput" min="1" max="20" value="20">
    </div>
  </div>

  <!-- Parts of Speech mode controls -->
  <div id="posControls" hidden>
    <div class="field">
      <label id="labelCategory">Category</label>
      <select id="posCategorySelect"></select>
    </div>
  </div>

  <!-- Synonyms & Antonyms mode controls -->
  <div id="synonymsControls" hidden>
    <div class="field">
      <label id="labelSynonymsCount">Number of words</label>
      <input type="number" id="synonymsCountInput" min="1" max="66" value="10">
    </div>
  </div>

  <!-- Quiz mode controls -->
  <div id="quizControls" hidden>
    <div class="field">
      <label id="labelQuizPool">Quiz Topic</label>
      <select id="quizPoolSelect"></select>
    </div>
    <div class="field">
      <label id="labelQuizCount">Number of questions</label>
      <input type="number" id="quizCountInput" min="3" max="30" value="10">
    </div>
  </div>

  <div id="worksheetControls">
    <div class="field" id="directionField">
      <div class="toggle-row">
        <label class="switch">
          <input type="checkbox" id="directionToggle">
          <span class="switch-slider"></span>
        </label>
        <span id="labelDirection" class="toggle-side-label">Translation Direction</span>
      </div>
    </div>

    <div class="field">
      <button type="button" id="showAnswerBtn" class="show-answer-btn">👁 Show Answer</button>
    </div>
  </div>

  <div class="field timer-widget">
    <div class="timer-controls">
      <label id="labelTimer">Timer</label>
      <input type="number" id="timerMinutesInput" min="1" max="60" value="1">
      <span id="labelTimerMinutes">Minutes</span>
      <button type="button" id="timerStartBtn" class="timer-icon-btn">▶</button>
      <button type="button" id="timerResetBtn" class="timer-icon-btn">↺</button>
    </div>
    <div class="timer-display" id="timerDisplay">01:00</div>
  </div>

  <div class="actions">
    <button id="fullscreenBtn">⛶ Fullscreen</button>
  </div>
</div>

<div id="sheets">
  <div id="sheetsContent"></div>
  <button type="button" id="exitFullscreenBtn" class="exit-fullscreen-btn">✕</button>
  <div id="fullscreenControls" class="fullscreen-controls">
    <button type="button" id="fsPlayPauseBtn" class="timer-icon-btn">▶</button>
    <button type="button" id="fsResetBtn" class="timer-icon-btn">↺</button>
    <button type="button" id="fsGenerateBtn">🔄 Generate</button>
  </div>
</div>

<div id="tutorialModal" class="tut-modal-overlay" hidden>
  <div class="tut-modal">
    <button type="button" id="tutorialModalClose" class="tut-modal-close">✕</button>
    <iframe id="tutorialFrame" title="Reference"></iframe>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/settings.js"></script>
<script src="js/generator.js"></script>
<script src="js/render.js"></script>
<script src="js/timer.js"></script>
<script src="js/main.js"></script>

</body>
</html>
